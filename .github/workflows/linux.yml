name: Linux.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [x64]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      DOCKER_IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env:latest

    steps:
      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patches.
        run: |
          if [ -f "Telegram/patches/lib_ui.patch" ]; then
            cd Telegram/lib_ui
            git apply ../patches/lib_ui.patch
          fi

      - name: Prepare Docker environment.
        run: |
          echo "Attempting to pull pre-built environment..."
          if docker pull ${{ env.DOCKER_IMAGE }}; then
            docker tag ${{ env.DOCKER_IMAGE }} ${{ env.IMAGE_TAG }}
            echo "Successfully pulled and tagged ${{ env.DOCKER_IMAGE }}"
          else
            echo "Pull failed, building Docker image from Dockerfile..."
            curl -sSL https://install.python-poetry.org | python3 -
            export PATH="$HOME/.local/bin:$PATH"
            cd Telegram/build/docker/centos_env
            poetry install
            DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
            echo "$DOCKERFILE" | DOCKER_BUILDKIT=1 docker build -t ${{ env.IMAGE_TAG }} -
            cd ../../../..
          fi

      - name: Setup ccache.
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.OS }}-${{ matrix.arch }}-ccache
          max-size: 5G

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          API="-D TDESKTOP_API_ID=${{ secrets.TELEGRAM_API_ID || '33205302' }} -D TDESKTOP_API_HASH=${{ secrets.TELEGRAM_API_HASH || '17198f4a34efe4d4889b8960c6951aa0' }}"

          mkdir -p "${CCACHE_DIR:-$HOME/.cache/ccache}"

          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD:/usr/src/tdesktop" \
            -v "${CCACHE_DIR:-$HOME/.cache/ccache}:/var/cache/ccache" \
            -e CONFIG=Debug \
            ${{ env.IMAGE_TAG }} \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            $API \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          found=0
          for f in out/Debug/Telegram out/Debug/MareletDesktop out/Debug/MargeletDesktop out/Release/Telegram out/Release/MareletDesktop out/Release/MargeletDesktop; do
            if [ -f "$f" ]; then
              echo "Found executable: $f"
              ls -lh "$f"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "Build error: no binary found in out/"
            exit 1
          fi

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          mkdir -p artifact
          for dir in out/Debug out/Release; do
            for bin in MareletDesktop MargeletDesktop Telegram Updater; do
              if [ -f "$dir/$bin" ]; then
                echo "Copying $dir/$bin to artifact/"
                cp -a "$dir/$bin" artifact/
              fi
            done
          done
          ls -la artifact/

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: MareletDesktop-Linux-x64
          path: artifact/
          retention-days: 14
